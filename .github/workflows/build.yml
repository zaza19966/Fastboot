name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: python3 setup.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FastBoost.apk
          gh release create "v${{ github.run_number }}" FastBoost.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "FastBoost v${{ github.run_number }}" \
            --notes "APK ready to install"
